<dialog class="k-dialog" id="dlg-order-fab" aria-labelledby="dlg-order-fab-title">
  <div class="k-dialog-head"><h2 id="dlg-order-fab-title">Commander une pièce CNC ou laser</h2></div>
  <div class="k-dialog-body k-form">
    <div class="k-field">
      <label for="fab-kind">Procédé</label>
      <select class="k-select" id="fab-kind">
        <option value="Usinage CNC">Usinage CNC</option>
        <option value="Découpe laser">Découpe laser</option>
      </select>
    </div>
    <div class="k-field">
      <label for="fab-part">Pièce à fabriquer</label>
      <input class="k-input" id="fab-part" type="text" autocomplete="off" placeholder="Ex. : plaque aluminium 4 mm x2">
    </div>
    <div class="k-field">
      <label for="fab-link">Robot ou projet lié</label>
      <select class="k-select" id="fab-link"></select>
    </div>
    <div class="k-field">
      <label for="fab-supplier">Prestataire</label>
      <select class="k-select" id="fab-supplier"></select>
    </div>
    <div class="k-field">
      <label for="fab-total">Montant (€)</label>
      <input class="k-input" id="fab-total" type="number" inputmode="decimal" min="0" step="0.01" value="">
    </div>
    <div class="k-field">
      <label for="fab-days">Délai de fabrication (jours)</label>
      <input class="k-input" id="fab-days" type="number" inputmode="numeric" min="1" step="1" value="7">
    </div>
    <p class="k-error k-hide" id="fab-err" role="alert"></p>
  </div>
  <div class="k-dialog-foot">
    <button class="k-btn" type="button" id="fab-cancel">Annuler</button>
    <button class="k-btn k-btn-primary" type="button" id="fab-submit">Passer la commande</button>
  </div>
</dialog>
