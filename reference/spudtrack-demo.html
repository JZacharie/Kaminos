<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpudTrack · Golden Spud Foods — UI-first AI-DLC demo</title>
<style>
:root{
  --bg:#f4f5fa;--panel:#fff;--panel-2:#f0f2f8;--text:#161b2e;--muted:#64708a;--line:#e2e6f0;
  --brand:#e9a210;--brand-soft:#fff3d6;--brand-ink:#7a4d00;--acc:#6a4cff;--acc-soft:#ece8ff;--acc-ink:#4328d6;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --ok-soft:#dcfce7;--warn-soft:#fef3c7;--bad-soft:#fee2e2;--info-soft:#dbeafe;
  --shadow:0 1px 2px rgba(20,27,50,.06),0 8px 24px rgba(20,27,50,.07);
  --sea:#dce8f7;--land:#eef0f6;--land-line:#c9d1e3;--grid:#c8d6ec;
  --m-truck:#2563eb;--m-ship:#0891b2;--m-air:#c026d3;
}
[data-theme="dark"]{
  --bg:#0d111f;--panel:#161b2d;--panel-2:#1d2339;--text:#e8ebf5;--muted:#93a0bd;--line:#29304d;
  --brand-soft:#3a2a07;--brand-ink:#f5c15a;--acc:#9a85ff;--acc-soft:#2a2550;--acc-ink:#c4b8ff;
  --ok-soft:#10301e;--warn-soft:#3a2a0a;--bad-soft:#3d1518;--info-soft:#14294d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --sea:#12203b;--land:#202943;--land-line:#303c5f;--grid:#1d2c4d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.25}
.ic{display:inline-block;vertical-align:-3px;flex:none}
.muted{color:var(--muted)}
.grow{flex:1}
.row{display:flex;align-items:center;gap:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.sr{position:absolute;left:-9999px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:18px;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.logo{width:36px;height:36px;border-radius:11px;background:radial-gradient(circle at 30% 25%,#ffd36b,#e9a210 60%,#c27d00);display:grid;place-items:center;color:#5a3600;font-weight:800;font-size:17px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.brand b{display:block;font-size:15.5px;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:11.5px}
.tabs{display:flex;gap:4px}
.tab{display:flex;align-items:center;gap:7px;padding:8px 13px;border:0;background:transparent;border-radius:9px;color:var(--muted);font-weight:600;position:relative}
.tab:hover{background:var(--panel-2);color:var(--text)}
.tab.on{background:var(--brand-soft);color:var(--brand-ink)}
.tab .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;line-height:16px}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip .dot.warn{background:var(--warn)}.chip .dot.off{background:var(--muted)}
.sel{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:5px 12px;font-weight:600;font-size:12.5px}
.iconbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;width:34px;height:34px;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--acc)}

/* ---------- inception bar ---------- */
.incbar{display:flex;align-items:center;gap:12px;padding:8px 22px;background:linear-gradient(90deg,var(--acc-soft),transparent 70%);border-bottom:1px solid var(--line);font-size:13px}
.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;font-weight:700;color:var(--acc-ink);padding:2px}
.switch .track{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"] .track{background:var(--acc)}
.switch[aria-checked="true"] .track::after{left:18px}
.vpill{font-weight:800;background:var(--acc);color:#fff;border-radius:7px;padding:1px 8px;font-size:12px}
.vpill.bump{animation:bump .6s}
.meter{width:120px;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--acc);color:var(--acc-ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
main{max-width:1500px;margin:0 auto;padding:22px}
.page-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px}
.page-h h1{font-size:22px}
.page-h p{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g-dash{grid-template-columns:1.1fr 1.1fr 1.2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;position:relative}
.card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:500;color:var(--muted)}
.kpi .lbl{color:var(--muted);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:4px 0 0}
.kpi .sub{color:var(--muted);font-size:12.5px}
.kpi.bad .val{color:var(--bad)}.kpi.warn .val{color:var(--warn)}.kpi.ok .val{color:var(--ok)}
.kpi .spark{position:absolute;right:16px;bottom:14px;opacity:.9}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b.ok{background:var(--ok-soft);color:var(--ok)}.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.bad{background:var(--bad-soft);color:var(--bad)}.b.info{background:var(--info-soft);color:var(--info)}
.b.gray{background:var(--panel-2);color:var(--muted)}.b.acc{background:var(--acc-soft);color:var(--acc-ink)}
.mode{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;color:#fff}
.mode.truck{background:var(--m-truck)}.mode.ship{background:var(--m-ship)}.mode.air{background:var(--m-air)}
.mode.dim{background:#94a3b8}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{position:relative;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th.has-pin{padding-right:36px}
.later:not(.card){outline:1px dashed var(--warn);outline-offset:2px;border-radius:6px}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.tbl th.sorted{color:var(--text)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tr.dimrow td{opacity:.5}
.tbl tr.hit td{background:var(--warn-soft)}
.tbl a,.lnk{color:var(--acc-ink);font-weight:700;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.tbl a:hover,.lnk:hover{text-decoration:underline}
.tbl .two{display:block;font-size:11.5px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;position:relative}
.input{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--brand-soft);color:var(--brand-ink)}
.tfoot{display:flex;align-items:center;gap:12px;padding:12px 4px 2px;position:relative;color:var(--muted);font-size:12.5px}

/* ---------- map ---------- */
.map-wrap{display:grid;grid-template-columns:1fr 330px;gap:16px}
.map-card{padding:0;overflow:visible}
.map-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.map-svg{display:block;width:100%;height:auto;border-radius:0 0 14px 14px;background:var(--sea)}
.map-svg .land{fill:var(--land);stroke:var(--land-line);stroke-width:1;stroke-linejoin:round}
.map-svg .seaw{fill:var(--sea);stroke:var(--land-line);stroke-width:.8}
.map-svg .gr{stroke:var(--grid);stroke-width:.5;opacity:.7}
.map-svg .lbl{font-size:9.5px;fill:var(--muted);font-weight:600;paint-order:stroke;stroke:var(--sea);stroke-width:3px}
.map-svg .mk{cursor:pointer}
.map-svg .mk:hover circle{stroke:var(--acc);stroke-width:3}
.map-svg .mk.sel circle{stroke:var(--acc);stroke-width:3.5}
.map-svg .mk.stale circle.halo{stroke-dasharray:3 3;opacity:.9}
.legend{position:absolute;left:14px;bottom:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;min-width:196px;backdrop-filter:blur(4px)}
.legend .lr{display:flex;align-items:center;gap:8px;padding:2px 0}
.fresh{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--info-soft);color:var(--info);position:relative}
.fresh.stale{background:var(--warn-soft);color:var(--warn)}

/* ---------- detail ---------- */
.tl{display:flex;align-items:flex-start;padding:6px 0 4px}
.tl .step{flex:1;text-align:center;position:relative;padding:0 6px}
.tl .step::before{content:"";position:absolute;top:19px;left:-50%;width:100%;height:4px;background:var(--line);z-index:0}
.tl .step:first-child::before{display:none}
.tl .step.done::before{background:var(--ok)}
.tl .step.active::before{background:linear-gradient(90deg,var(--ok),var(--acc))}
.tl .node{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--panel-2);border:3px solid var(--line);color:var(--muted)}
.tl .done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.tl .active .node{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 6px var(--acc-soft)}
.tl .blocked .node{background:var(--bad);border-color:var(--bad);color:#fff}
.tl h4{font-size:13px}.tl small{display:block;color:var(--muted);font-size:11.5px}
.tl .step.cust .node{border-radius:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.dash-ph{border:2px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:13px;text-align:center}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.sev{width:9px;height:9px;border-radius:50%;flex:none}
.sev.crit{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}
.ch{display:inline-flex;gap:3px;color:var(--muted)}
.ch .ic{background:var(--panel-2);border-radius:5px;padding:2px;width:20px;height:20px}
.callout{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--text);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;position:relative}
.bars i{flex:1;border-radius:5px 5px 0 0;background:var(--info);min-height:3px}
.bars i.over{background:var(--bad)}

/* ---------- inception pins / popover ---------- */
.has-pin{position:relative}
.pin{position:absolute;top:-11px;right:-11px;z-index:30;width:24px;height:24px;padding:0;border-radius:50%;border:2px solid var(--panel);background:var(--acc);color:#fff;font:800 11px/1 system-ui,sans-serif;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(106,76,255,.55);transition:transform .15s}
.pin:hover{transform:scale(1.18)}
.pin.in{top:50%;right:4px;margin-top:-12px}
.pin.pending::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--acc);animation:pulse 1.7s ease-out infinite;pointer-events:none}
.pin.done{background:var(--ok);box-shadow:0 2px 8px rgba(22,163,74,.5)}
.pin.other{background:var(--warn)}
body:not(.inception) .pin{display:none}
.anchor-active{outline:2px dashed var(--acc);outline-offset:3px;border-radius:10px}
.flash{animation:flash 1.4s ease-out}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--acc);background-color:var(--acc-soft)}60%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.pop{position:fixed;z-index:90;width:410px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--acc);border-radius:16px;box-shadow:0 24px 70px rgba(10,15,40,.35);padding:16px 18px 14px}
.pop .tags{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pop h3{font-size:16.5px;margin-bottom:6px}
.pop .ctx{background:var(--panel-2);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.pop .ctx b{color:var(--text)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 11px;margin-bottom:7px}
.opt:hover{border-color:var(--acc)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;font-weight:800;font-size:12px}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .k{background:var(--acc);color:#fff}
.otherbox{display:flex;gap:6px;margin:0 0 8px 34px}
.otherbox .input{flex:1;min-width:0}
.result{background:var(--ok-soft);border-radius:10px;padding:9px 11px;font-size:12.5px;margin-top:6px}
.result code{font-weight:800}

/* ---------- drawers / modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,35,.35);z-index:60}
.drawer{position:fixed;top:0;bottom:0;width:430px;background:var(--panel);z-index:70;box-shadow:0 0 60px rgba(10,15,40,.35);display:flex;flex-direction:column;animation:slide .25s}
.drawer.right{right:0;border-left:1px solid var(--line)}
.drawer.left{left:0;width:560px;border-right:1px solid var(--line);animation-name:slideL}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer header h2{font-size:17px}
.drawer .body{padding:14px 18px 40px;overflow:auto;flex:1}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.stage{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.stage .sh{display:flex;align-items:center;gap:8px;font-weight:700}
.stage ul{list-style:none;margin:8px 0 6px;padding:0}
.stage li button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:3px 0;font-size:12.5px;color:var(--muted);width:100%}
.stage li button:hover{color:var(--acc-ink)}
.qdot{width:10px;height:10px;border-radius:50%;border:2px solid var(--acc);flex:none}
.qdot.on{background:var(--ok);border-color:var(--ok)}
.gate{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-size:12.5px}
.gate textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);margin:6px 0}
.req{padding:8px 10px;border-left:3px solid var(--info);background:var(--panel-2);border-radius:0 9px 9px 0;margin-bottom:7px;font-size:12.5px}
.req.NFR{border-left-color:var(--warn)}.req.SC{border-left-color:var(--muted)}
.req b{font-family:ui-monospace,Menlo,monospace;color:var(--info)}.req.NFR b{color:var(--warn)}
.req small{display:block;color:var(--muted);margin-top:2px}
.req.hl{animation:flash 2.2s ease-out}
.modal{position:fixed;z-index:75;left:50%;top:50%;transform:translate(-50%,-50%);width:min(820px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal pre{margin:0;padding:14px 18px;overflow:auto;background:var(--panel-2);font:12px/1.5 ui-monospace,Menlo,monospace;flex:1;white-space:pre-wrap;min-height:260px}
.modal .mb{padding:12px 18px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
.scope-card{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.scope-card.s-out{background:var(--panel-2);opacity:.85}
.scope-card p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.ribbon{position:absolute;left:14px;top:-10px;z-index:25;background:#475569;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 9px;border-radius:99px}
.ribbon.later{background:var(--warn)}
.oos:not(.card){opacity:.42;filter:grayscale(1)}
.card.oos>*:not(.pin):not(.ribbon){opacity:.36;filter:grayscale(1)}
.later.card{outline:2px dashed var(--warn);outline-offset:-2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;background:#111827;color:#fff;border-radius:12px;padding:10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:toast 3s forwards}
.toast .vp{background:var(--acc);border-radius:7px;padding:0 8px;font-weight:800}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.onb{position:fixed;z-index:110;width:300px;background:#1f1a4d;color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.onb::before{content:"";position:absolute;top:-8px;left:var(--ax,40px);width:16px;height:16px;background:#1f1a4d;transform:rotate(45deg)}
.onb h4{font-size:14px;margin-bottom:4px}.onb p{margin:0 0 10px;font-size:12.5px;opacity:.9}
.onb .row{justify-content:space-between}
.onb .btn{background:#fff;color:#1f1a4d;border-color:#fff}
.onb .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.role-banner{background:var(--info-soft);color:var(--info);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-weight:600}
@media (max-width:1380px){.tabs .tab span.t{display:none}.brand{min-width:0}}
</style>
</head>
<body class="inception">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

/* seeded pseudo-random so mock sensor series are stable between renders */
function rng(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
function series(seed, base, amp, spike) {
  const r = rng(seed);
  return Array.from({ length: 24 }, (_, i) => {
    let v = base + (r() - 0.5) * amp;
    if (spike) { const d = Math.abs(i - spike[0]); if (d < 4) v = Math.max(v, base + (spike[1] - base) * (1 - d / 4)); }
    return Math.round(v * 10) / 10;
  });
}
function sensorsOf(s) {
  const sp = s.sp || {};
  return { temp: series(s.id + 't', s.mode === 'air' ? 20 : 19, 3, sp.temp), hum: series(s.id + 'h', 44, 6, sp.hum) };
}

  else if (CFG.kpi4 === 'cost') { const o = vs.filter((s) => s.dir === 'out' && s.cost && s.state !== 'delivered'); const v = Math.round(o.reduce((a, s) => a + s.cost, 0) / (o.length || 1)); k4 = kpiHtml('id="a-kpi-slot4"', 'Logistics cost per pallet', `${v} €`, 'average of active outbound shipments', '', 'Q4'); }
  else if (CFG.kpi4 === 'co2') { const o = active.filter((s) => s.pallets); const v = Math.round(o.reduce((a, s) => a + s.co2, 0) / (o.reduce((a, s) => a + s.pallets * 0.45, 0) || 1)); k4 = kpiHtml('id="a-kpi-slot4"', 'CO₂e per tonne', `${v} kg/t`, 'weighted average of active shipments', '', 'Q4'); }
  else k4 = kpiHtml('id="a-kpi-slot4"', '% of on-time deliveries', `${ontime} %`, 'threshold: ' + thrLabel(), ontime >= 80 ? 'ok' : 'warn', 'Q4 Q3');
  const kinds = [
    { l: 'On time', c: '#16a34a', k: 'ontime' }, { l: 'At port', c: '#2563eb', k: 'port' }, { l: 'At customs', c: '#d97706', k: 'customs' },

  ].map((x) => Object.assign(x, { n: vs.filter((s) => statusOf(s).key === x.k).length }));
  const thr = thrChart(), top = 40;
  const bars = DELAY_HISTORY.map((v, i) => `<i class="${v > thr ? 'over' : ''}" style="height:${Math.min(100, (v / top) * 100)}%" title="Day -${14 - i}: ${v} h average delay"></i>`).join('');

  const feed = alerts.slice(0, 6);

  return `<div class="page-h"><div><h1>Operations dashboard</h1><p>Mon Nov 2, 2026 · 10:00 · ${vs.length} shipments in the last 14-day window</p></div></div>
  <div class="grid g4" style="margin-bottom:16px">
    ${kpiHtml('', 'In transit', active.length, `${fmtN(sumUnits(active))} ${unitN[1]} en route`, '', 'Q2')}
    ${kpiHtml('id="a-kpi-delayed"', 'Delayed', delayed.length, 'threshold: ' + thrLabel(), delayed.length ? 'bad' : 'ok', 'Q3')}
    ${kpiHtml('', 'Active alerts', alerts.length, `${alerts.filter((a) => a.sev === 'crit').length} critical`, alerts.some((a) => a.sev === 'crit') ? 'warn' : '', 'Q9 Q7', 'data-module="alerts"')}
    ${k4}
  </div>
  <div class="grid g-dash">
    <section class="card"><h3>Shipments by status <small>${CFG.delay.mode === 'sla' ? 'delay per SLA' : 'delay ' + thrLabel()}</small></h3>
      <div class="row" style="gap:18px"><div ${dq('Q3')}>${donut(kinds)}</div><ul class="list" style="flex:1">${kinds.map((k) => `<li style="padding:5px 0"><span class="sev" style="background:${k.c}"></span><span class="grow">${k.l}</span><b>${k.n}</b></li>`).join('')}</ul></div>
      <h3 style="margin-top:14px">By transport mode</h3>
      <div class="row" style="height:12px;border-radius:9px;overflow:hidden;gap:2px">${modeCount.map((x) => `<span style="flex:${x.n};background:${airDim({ mode: x.m, urgent: false }) && x.m === 'air' && CFG.air === 'later' ? '#94a3b8' : COLORS[x.m]};height:100%" title="${MODES[x.m].label}: ${x.n}"></span>`).join('')}</div>
      <div class="row muted" style="gap:14px;margin-top:6px;font-size:12.5px">${modeCount.map((x) => `<span>${icon(MODES[x.m].icon, 14)} ${MODES[x.m].label} ${x.n}</span>`).join('')}</div>
    </section>
    <section class="card"><h3>Average daily delay <small>last 14 days · line = threshold</small></h3>
      <div class="bars" ${dq('Q3')}>${bars}<div style="position:absolute;left:0;right:0;bottom:${(thr / top) * 100}%;border-top:2px dashed var(--bad)"></div></div>
      <div class="row muted" style="justify-content:space-between;font-size:12px;margin-top:6px"><span>14 days ago</span><span>threshold ${CFG.delay.mode === 'sla' ? '≈ 18 h (SLA average)' : thr + ' h'}</span><span>today</span></div>

      ${feed.length ? `<ul class="list">${feed.map((a) => `<li><span class="sev ${a.sev}" title="Severity ${a.sev}"></span><div class="grow"><a class="lnk" href="#/shipment/${a.ship}">${a.ship}</a> ${esc(a.text)}<div class="muted" style="font-size:11.5px">${ALERT_LABELS[a.type]} · ${a.ago}</div></div>${chIcons(a.sev)}</li>`).join('')}</ul>` : '<div class="dash-ph">No alerts with the current configuration.</div>'}
    </section>

  <section class="card" style="margin-top:16px"><h3>Needs attention <small>delayed or held at customs</small></h3>
    <table class="tbl"><thead><tr><th>Shipment</th><th>Route</th><th>ETA</th><th>Status</th><th>Carrier</th></tr></thead><tbody>
    ${attention.map((s) => `<tr><td><a href="#/shipment/${s.id}">${s.id}</a></td><td>${nodeName(s.from)} → ${nodeName(s.to)}</td><td>${etaCell(s)}</td><td${dq('Q3')}><span class="b ${statusOf(s).cls}">${statusOf(s).label}</span></td><td>${s.carrier}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nothing to attend to with the current threshold.</td></tr>'}
    </tbody></table></section>`;
}

/* ---- map ---- */

  }).join('');

  }).join('');
  const OFF = { fab: [-9, -8, 'end'], vlc: [-9, 15, 'end'], bcn: [9, -4, 'start'], alg: [-9, 14, 'end'], fxt: [9, -4, 'start'], ewr: [-9, -9, 'end'], sav: [-9, 14, 'end'], jea: [-10, 17, 'end'], lyo: [9, 3, 'start'], mil: [9, 3, 'start'], ber: [9, 3, 'start'] };

  }).join('');
  const grat = [-90, -70, -50, -30, -10, 10, 30, 50].map((l) => `<line class="gr" x1="${(l + 100) * 6.25}" y1="0" x2="${(l + 100) * 6.25}" y2="430"/>`).join('') + [60, 50, 40, 30, 20, 10].map((l) => `<line class="gr" x1="0" y1="${(66 - l) * 7.4}" x2="1000" y2="${(66 - l) * 7.4}"/>`).join('');
  const sel = SHIPMENTS.find((s) => s.id === ui.sel) || vs[0];
  const counts = (m) => visibleShipments().filter((s) => s.state !== 'delivered' && s.mode === m).length;

    <div class="seg" role="group" aria-label="Filter by mode">${[['all', 'All'], ['truck', 'Truck'], ['ship', 'Ship'], ['air', 'Plane']].filter((m) => !(m[0] === 'air' && CFG.air === 'none')).map((m) => `<button class="${ui.mapMode === m[0] ? 'on' : ''}" data-act="mapmode" data-v="${m[0]}" ${m[0] === 'air' ? 'data-module="air"' : ''}>${m[0] !== 'all' ? icon(MODES[m[0]].icon, 14) : ''}${m[1]}</button>`).join('')}</div></div>
  <div class="map-wrap"><section class="card map-card" data-module="map">
    <div class="map-head"><b>Live positions</b><span class="grow"></span><span id="a-map-fresh" class="fresh ${stale ? 'stale' : ''}" ${dq('Q5')}>${icon('ship', 14)} Ships: ${CFG.pos.src} · ${age}</span></div>
    <svg class="map-svg" viewBox="0 0 1000 430" role="img" aria-label="Stylised map of Europe, the Middle East and the US east coast">

      ${LAND.map((poly) => `<polygon class="land" points="${polyStr(poly.map(proj))}"/>`).join('')}
      <polygon class="seaw" points="${polyStr(BALTIC.map(proj))}"/>
      ${lines}${nodes}${marks}
    </svg>
    <div id="a-map-legend" class="legend" ${dq('Q6')}>
      <b style="display:block;margin-bottom:4px">Legend</b>

      <div class="lr"><span class="mode ship">${icon('ship', 14)}</span> Ship <span class="grow"></span><b>${counts('ship')}</b></div>
      ${CFG.air === 'none' ? '' : `<div class="lr" data-module="air"><span class="mode ${CFG.air === 'full' ? 'air' : 'dim'}">${icon('plane', 14)}</span> Plane${airNote} <span class="grow"></span><b>${counts('air')}</b></div>`}
      <div class="lr"><span style="width:26px;display:grid;place-items:center"><span style="width:10px;height:10px;background:#e9a210;border:1.5px solid var(--muted);border-radius:2px"></span></span> Factory / port / DC</div>

}
function mapSide(s) {

const modeIconHtml = (s) => `<span class="mode ${airDim(s) ? 'dim' : s.mode}" title="${MODES[s.mode].label}">${icon(MODES[s.mode].icon, 15)}</span>`;
const legTitle = (l) => (l.a === l.b ? `Delivery at destination (${nodeName(l.b)})` : `${MODES[l.m].label}: ${nodeName(l.a)} → ${nodeName(l.b)}`);

/* ---- shipments list ---- */
const SORTERS = {
  id: (s) => s.id, mode: (s) => s.mode, route: (s) => nodeName(s.from) + nodeName(s.to), unit: (s) => unitCount(s),
  bbd: (s) => s.shelf, eta: (s) => s.etaTs, status: (s) => STATUS_ORDER[statusOf(s).key], carrier: (s) => s.carrier,
};
const PAGE_SIZE = { A: 20, B: 10, C: 10, D: 6 };
const SCALE_INFO = {
  A: ['up to 100 active shipments', 'Full load in the browser'],
  B: ['up to 1,000 active shipments', 'Client-side pagination · response < 2 s'],
  C: ['up to 10,000 active shipments', 'Server-side pagination and filters'],
  D: ['over 10,000 active shipments', 'Indexed search and virtualized lists'],
};
function filteredShipments() {
  let list = visibleShipments();
  if (ui.mode !== 'all') list = list.filter((s) => s.mode === ui.mode);
  if (ui.status !== 'all') list = list.filter((s) => statusOf(s).key === ui.status);
  const q = ui.search.trim().toLowerCase();
  if (q) list = list.filter((s) => [s.id, nodeName(s.from), nodeName(s.to), s.carrier, s.cargo.map((c) => c[0]).join(' ')].join(' ').toLowerCase().includes(q));
  const f = SORTERS[ui.sort.key] || SORTERS.eta;
  return list.slice().sort((a, b) => (f(a) > f(b) ? 1 : f(a) < f(b) ? -1 : 0) * ui.sort.dir);
}
const lotHit = (s) => lotSearchOn() && ui.lot.trim() && s.cargo.some((c) => c[1].toLowerCase().includes(ui.lot.trim().toLowerCase()));
function th(key, label, extra, attrs) {
  const on = ui.sort.key === key;
  return `<th ${attrs || ''} class="${on ? 'sorted' : ''} ${extra || ''}" aria-sort="${on ? (ui.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-act="sort" data-v="${key}">${label}${on ? (ui.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
}
function viewShipments() {
  const all = filteredShipments(), size = PAGE_SIZE[CFG.scale], pages = Math.max(1, Math.ceil(all.length / size));
  if (ui.page >= pages) ui.page = pages - 1;
  const rows = all.slice(ui.page * size, ui.page * size + size);
  const hits = lotSearchOn() && ui.lot.trim() ? visibleShipments().filter(lotHit) : [];
  const recall = hits.length
    ? `<div class="callout" data-module="recall"><b>Simulated recall · lot "${esc(ui.lot.trim())}"</b>: ${hits.length} ${plural(hits.length, 'shipment', 'shipments')} (${hits.map((s) => s.id).join(', ')}) · ${fmtN(hits.reduce((a, s) => a + s.pallets, 0))} pallets · destinations: ${[...new Set(hits.map((s) => nodeName(s.to)))].join(', ')}.</div>`
    : (lotSearchOn() && ui.lot.trim() ? '<div class="callout" data-module="recall">No shipment contains that lot.</div>' : '');
  const info = SCALE_INFO[CFG.scale];
  return `<div class="page-h"><div><h1>Shipments</h1><p>Inbound (raw materials) and outbound (finished goods)</p></div></div>
  <div id="a-shipments-toolbar" class="card toolbar" ${dq('Q10')}>
    <input id="search-input" class="input" data-input="search" placeholder="Search shipment, route, SKU, carrier…" value="${esc(ui.search)}" aria-label="Search shipments">
    <div class="seg" role="group" aria-label="Filter by mode">${[['all', 'All'], ['truck', 'Truck'], ['ship', 'Ship'], ['air', 'Plane']].filter((m) => !(m[0] === 'air' && CFG.air === 'none')).map((m) => `<button class="${ui.mode === m[0] ? 'on' : ''}" data-act="fmode" data-v="${m[0]}" ${m[0] === 'air' ? 'data-module="air"' : ''}>${m[1]}</button>`).join('')}</div>
    <select class="sel" style="border-radius:9px" data-change="fstatus" aria-label="Filter by status"><option value="all">All statuses</option><option value="delayed" ${ui.status === 'delayed' ? 'selected' : ''}>Delayed</option>${CFG.customs !== 'none' ? `<option value="customs" ${ui.status === 'customs' ? 'selected' : ''}>At customs</option>` : ''}<option value="port" ${ui.status === 'port' ? 'selected' : ''}>At port</option><option value="ontime" ${ui.status === 'ontime' ? 'selected' : ''}>On time</option><option value="delivered" ${ui.status === 'delivered' ? 'selected' : ''}>Delivered</option></select>
    ${lotSearchOn() ? `<span class="row" data-module="recall" ${dq('Q10')}>${icon('link', 16)}<input id="lot-input" class="input" style="min-width:150px" data-input="lot" placeholder="Lot, e.g. L2644" value="${esc(ui.lot)}" aria-label="Search by lot"><button class="btn sm" data-act="lotex">Example</button></span>` : ''}
  </div>
  ${recall}
  <div class="card" style="padding:6px 8px 12px"><table class="tbl"><thead><tr>
    ${th('id', 'Shipment')}${th('mode', 'Mode')}${th('route', 'Route')}${th('unit', 'Unit', 'has-pin', 'id="a-col-unit"')}<th>Cargo</th>${lotSearchOn() ? '<th data-module="recall">Lots</th>' : ''}${th('bbd', 'Best-before', 'has-pin', 'id="a-col-bbd" data-module="shelf"')}${th('eta', 'ETA', '', 'data-module="eta"')}${th('status', 'Status')}${th('carrier', 'Carrier')}
  </tr></thead><tbody>${rows.map((s) => {
    const st = statusOf(s), u = unitCell(s);
    return `<tr class="${airDim(s) ? 'dimrow' : ''} ${lotHit(s) ? 'hit' : ''}" ${s.mode === 'air' ? 'data-module="air"' : ''}>
      <td><a href="#/shipment/${s.id}">${s.id}</a>${CFG.erp === 'sap_rt' || CFG.erp === 'sap_batch' ? `<span class="two mono">PO ${s.po}</span>` : ''}</td>

      <td${dq('Q2')}><b>${u.v}</b><span class="two mono">${u.id}</span></td>
      <td>${esc(s.cargo[0][0])}${s.cargo.length > 1 ? `<span class="two">+${s.cargo.length - 1} ${plural(s.cargo.length - 1, 'reference', 'references')}</span>` : ''}</td>
      ${lotSearchOn() ? `<td class="mono" data-module="recall">${s.cargo.map((c) => c[1]).join(', ')}</td>` : ''}
      <td${dq('Q11')}>${shelfCell(s)}</td>
      <td${dq('Q14')}>${etaCell(s)}</td>
      <td${dq('Q3')}><span class="b ${st.cls}">${st.label}</span></td>
      <td>${s.carrier}</td></tr>`;
  }).join('') || '<tr><td colspan="10" class="muted" style="padding:24px;text-align:center">No shipments match the filters.</td></tr>'}</tbody></table>
  <div id="a-table-footer" class="tfoot" ${dq('Q18')}>
    <span ${dq('Q18')}>Showing ${all.length ? ui.page * size + 1 : 0}–${Math.min(all.length, ui.page * size + size)} of ${all.length}</span>
    <button class="btn sm" data-act="page" data-v="-1" ${ui.page === 0 ? 'disabled' : ''}>‹ Previous</button>
    <span>Page ${ui.page + 1} of ${pages}</span>
    <button class="btn sm" data-act="page" data-v="1" ${ui.page >= pages - 1 ? 'disabled' : ''}>Next ›</button>
    <span class="grow"></span>
    <span class="b acc" ${dq('Q18')}>Target scale: ${info[0]}</span><span ${dq('Q18')}>${info[1]}</span>
  </div></div>`;
}

/* ---- shipment detail ---- */
function miniChart(vals, lim, lo, hi, unit, label, ic) {
  const W = 260, H = 74, x = (i) => (i / (vals.length - 1)) * W, y = (v) => H - ((Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo)) * H;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = vals[vals.length - 1], max = Math.max(...vals), bad = max > lim;
  return `<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>${icon(ic, 15)} ${label}</b><span class="b ${bad ? 'bad' : 'ok'}">${last}${unit} · max ${max}${unit}</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="74" role="img" aria-label="${label} last 24 h" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${y(lim)}" y2="${y(lim)}" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1.2"/><polygon points="0,${H} ${pts} ${W},${H}" fill="${bad ? 'var(--bad)' : 'var(--info)'}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${bad ? 'var(--bad)' : 'var(--info)'}" stroke-width="2" stroke-linejoin="round"/></svg>
    <div class="muted" style="font-size:11.5px">last 24 h · limit ${lim}${unit}</div></div>`;
}
function docsOf(s) {
  const st = (i, name) => (s.id === 'SP-2417' && /Lading/.test(name) ? 'missing' : s.id === 'SP-2413' && /Packing/.test(name) ? 'pending' : s.id === 'SP-2405' && /CDS/.test(name) ? 'pending' : (hashOf(s.id) + i) % 7 === 0 ? 'pending' : 'ok');
  const names = [];
  if (s.legs.some((l) => l.m === 'truck')) names.push('CMR (road consignment note)');

function positionPop() {

  el.classList.add('anchor-active');
  const r = el.getBoundingClientRect();
  let x = r.right + 18, y = r.top - 12;

  const lines = reqLines(), sc = scopeLines(), done = QUESTIONS.filter(answered).length;
  const stages = STAGES.map((s) => {
    const qs = QUESTIONS.filter((q) => q.stage === s.id), n = qs.filter(answered).length, g = state.gates[s.id];
    const gate = g
      ? `<div class="gate">${g.status === 'approved' ? '<span class="b ok">✓ Stage approved</span>' : `<span class="b warn">✎ Changes requested</span><div style="margin-top:4px">${esc(g.comment || '')}</div>`} <button class="btn sm ghost" data-act="gatereopen" data-stage="${s.id}">Reopen</button></div>`
      : ui.gateEdit === s.id
        ? `<div class="gate"><label for="gate-text">What should change?</label><textarea id="gate-text" placeholder="E.g. I want to see the cost per pallet on the dashboard"></textarea><div class="row"><button class="btn sm pri" data-act="gatesend" data-stage="${s.id}">Send changes</button><button class="btn sm" data-act="gatecancel">Cancel</button></div></div>`
        : `<div class="gate"><b>Is this what you meant?</b>${n < qs.length ? ` <span class="muted">(partial: ${n}/${qs.length})</span>` : ''}<div class="row" style="margin-top:6px"><button class="btn sm ok" data-act="gateok" data-stage="${s.id}">Approve</button><button class="btn sm" data-act="gatechg" data-stage="${s.id}">Request changes</button></div></div>`;
    return `<div class="stage"><div class="sh"><span class="b acc">${s.id}</span>${s.name}<span class="grow"></span><span class="muted" style="font-weight:600">${n}/${qs.length}</span></div>
      <div class="meter" style="width:100%;margin-top:6px"><i style="width:${(n / qs.length) * 100}%"></i></div>
      <ul>${qs.map((q) => `<li><button data-act="gotoq" data-qid="${q.id}"><span class="qdot ${answered(q) ? 'on' : ''}"></span><span><b>${q.id}</b> · ${esc(q.text)}</span></button></li>`).join('')}</ul>${gate}</div>`;
  }).join('');
  const reqHtml = (l) => `<div class="req ${l.kind} ${ui.hl === l.qid || ui.hl === l.id ? 'hl' : ''}"><b>${l.id}</b> ${esc(l.text)}<small>${esc(l.trace)}</small></div>`;
  return `<aside class="drawer right" id="drawer" role="complementary" aria-label="AI-DLC: stages and requirements">
    <header><h2>${icon('spark', 17)} AI-DLC · Inception</h2><span class="grow"></span><button class="iconbtn" data-act="drawer" aria-label="Close panel (Esc)">${icon('x', 14)}</button></header>
    <div class="body"><p class="muted" style="margin:0 0 12px">${done}/${QUESTIONS.length} questions · version v${state.version}. Requirements are built live from your answers.</p>
    <h3 style="margin:0 0 8px">Stages and gates</h3>${stages}
    <h3 style="margin:16px 0 8px">Live requirements <span class="b gray">${lines.length}</span></h3>
    ${lines.length ? lines.map(reqHtml).join('') : '<div class="dash-ph">Answer a question (purple pin) and its FR/NFR will appear here.</div>'}
    ${sc.length ? `<h3 style="margin:16px 0 8px">Scope (1.4)</h3>${sc.map(reqHtml).join('')}` : ''}</div></aside>`;
}

/* ---- scope board ---- */
function scopeHtml() {
  const SEG = [['mvp', 'MVP'], ['later', 'Later'], ['out', 'Out']];
  return `<aside class="drawer left" id="scopeboard" role="dialog" aria-label="Scope board">
    <header><div><h2>${icon('layers', 17)} Scope board · 1.4</h2><span class="muted" style="font-size:12.5px">Move each module to MVP, Later or Out. “Out” is dimmed in the app with a ribbon.</span></div><span class="grow"></span><button class="iconbtn" data-act="scope" aria-label="Close board (Esc)">${icon('x', 14)}</button></header>
    <div class="body">${MODULES.map((m) => { const v = state.scope[m.id] || 'mvp'; return `<div class="scope-card s-${v}"><div class="grow"><b>${m.name}</b><p>${m.desc}</p><p>Questions: ${m.q.join(', ')}</p></div><div class="seg" role="group" aria-label="Scope of ${m.name}">${SEG.map((s) => `<button class="${v === s[0] ? 'on' : ''}" data-act="scopeset" data-m="${m.id}" data-v="${s[0]}">${s[1]}</button>`).join('')}</div></div>`; }).join('')}</div></aside>`;
}

/* ---- export ---- */
function exportQuestionsMd() {
  const out = ['# Requirements Analysis Questions', '', 'Please answer each question by filling in the letter choice after the [Answer]: tag.', 'If none of the options match, choose X (Other) and describe your preference after the [Answer]: tag.', `Generated by SpudTrack UI-first Inception demo · UI version v${state.version}.`, ''];
  QUESTIONS.forEach((q) => {
    const a = state.answers[q.id];
    out.push('---', '', `## Question ${q.n}`, `<!-- stage ${q.stage} · produces ${q.fr.id} · anchored to #${q.anchor} (${q.label}) -->`, `Context: ${q.context}`, '', q.text, '');
    q.options.forEach((o) => out.push(`${o.k}) ${o.t}`));
    out.push('X) Other (please describe after [Answer]: tag below)', '', `[Answer]: ${a ? (a.k === 'X' ? 'X — ' + (a.text || '') : a.k) : ''}`, '');
  });
  return out.join('\n');
}
function exportUiMap() {
  const scr = SCREENS.concat([{ id: 'shell', title: 'Top bar (all screens)', hash: '#/dashboard' }]);
  const where = (q) => (GLOBAL_ANCHORS.includes(q.anchor) ? 'shell' : q.screen);
  return JSON.stringify({
    app: 'SpudTrack', company: 'Golden Spud Foods Ltd.', generatedBy: 'UI-first AI-DLC demo', uiVersion: state.version,
    screens: scr.map((sc) => ({ id: sc.id, title: sc.title, route: sc.hash, elements: QUESTIONS.filter((q) => where(q) === sc.id).map((q) => ({ elementId: q.anchor, label: q.label, questionIds: [q.id], frIds: [q.fr.id], module: modOfQ(q.id) })) })),
    questions: QUESTIONS.map((q) => { const a = state.answers[q.id]; return { id: q.id, stage: q.stage, anchor: q.anchor, screen: where(q), requirement: q.fr.id, effect: q.effect, uiEffect: UI_EFFECT_TEXT[q.id], answer: a ? a.k : null, answerText: a ? (a.k === 'X' ? a.text || '' : (q.options.find((o) => o.k === a.k) || {}).t) : null }; }),
    scope: MODULES.map((m) => ({ module: m.id, name: m.name, scope: state.scope[m.id] || 'mvp', questionIds: m.q })),
    gates: state.gates, derivedConfig: deriveCfg(),
  }, null, 2);
}
function exportRequirementsMd() {
  const lines = reqLines(), fr = lines.filter((l) => l.kind === 'FR'), nfr = lines.filter((l) => l.kind === 'NFR');
  const open = QUESTIONS.filter((q) => !answered(q) || state.answers[q.id].k === 'X');
  const sec = (l) => `### ${l.id}\n${l.text}\n_Trace: ${l.trace.replace('← ', '')}_\n`;
  return ['# Requirements Document (draft) — SpudTrack', '', `> Built live from the UI-first Inception session · UI version v${state.version}.`, '',
    '## 1. Intent Analysis Summary', '- **User Request**: Multimodal shipment and goods tracking application (truck, ship, plane) for Golden Spud Foods Ltd.',
    '- **Request Type**: New Project', '- **Scope Estimate**: Multiple Components', '- **Requirements Depth**: Standard', '',
    '## 2. Functional Requirements', '', fr.length ? fr.map(sec).join('\n') : '_No answers yet._', '',
    '## 3. Non-Functional Requirements', '', nfr.length ? nfr.map(sec).join('\n') : '_No answers yet._', '',
    '## 4. Scope (Inception 1.4)', '', '| Module | Scope | Linked questions |', '|---|---|---|', ...MODULES.map((m) => `| ${m.name} | ${{ mvp: 'MVP', later: 'Later', out: 'Out' }[state.scope[m.id] || 'mvp']} | ${m.q.join(', ')} |`), '',
    '## 5. Stage Gates', '', ...STAGES.map((s) => { const g = state.gates[s.id]; return `- ${s.id} ${s.name}: ${g ? (g.status === 'approved' ? 'Approved' : 'Changes requested — ' + (g.comment || '')) : 'Pending'}`; }), '',
    '## 6. Open Items', '', open.length ? open.map((q) => `- ${q.id} (${q.fr.id}): ${state.answers[q.id] ? 'Other — ' + (state.answers[q.id].text || 'to be defined') : 'unanswered'}`).join('\n') : '_None._', ''].join('\n');
}
const EXPORTS = [
  { name: 'requirements-analysis-questions.md', mime: 'text/markdown', build: exportQuestionsMd },
  { name: 'ui-map.json', mime: 'application/json', build: exportUiMap },
  { name: 'requirements.md', mime: 'text/markdown', build: exportRequirementsMd },
];
function exportHtml() {
  const f = EXPORTS[ui.expFile], txt = f.build();
  return `<div class="modal" id="exportmodal" role="dialog" aria-label="Export AI-DLC artifacts">
    <header><h2>${icon('download', 18)} Export to the AI-DLC flow</h2><span class="grow"></span><button class="iconbtn" data-act="export" aria-label="Close (Esc)">${icon('x', 14)}</button></header>
    <div class="mb" style="border-top:0"><div class="seg" role="tablist">${EXPORTS.map((e, i) => `<button class="${i === ui.expFile ? 'on' : ''}" role="tab" data-act="expfile" data-v="${i}">${e.name}</button>`).join('')}</div></div>
    <pre tabindex="0" aria-label="Preview of ${f.name}">${esc(txt)}</pre>
    <div class="mb"><span class="muted grow">${txt.length.toLocaleString('en-GB')} characters · downloads as a local file, no network.</span><button class="btn" data-act="dlone">${icon('download', 15)} Download this</button><button class="btn pri" data-act="dlall">${icon('download', 15)} Download all 3</button></div></div>`;
}
function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ---- onboarding (3 steps) ---- */
const ONB = [
  { target: 'inception-toggle', title: '1 of 3 · Numbered pins', text: 'Each purple pin sits on the element the question is about. Click it, answer, and the interface changes instantly.' },
  { target: 'btn-drawer', title: '2 of 3 · AI-DLC panel', text: 'The list of requirements (FR/NFR) is written here with traceability to each question, and you approve each stage.' },
  { target: 'btn-export', title: '3 of 3 · Export', text: 'Download the questions in AI-DLC format, ui-map.json and requirements.md to continue in a real run.' },
];
function onbHtml() {
  const s = ONB[state.onb];
  return s ? `<div class="onb" id="onb" role="dialog" aria-label="Getting started tour"><h4>${s.title}</h4><p>${s.text}</p><div class="row"><button class="btn sm" data-act="onbskip">Skip tour</button><button class="btn sm" data-act="onbnext">${state.onb === 2 ? 'Start' : 'Next'}</button></div></div>` : '';
}
function positionOnb() {
  const o = document.getElementById('onb');
  if (!o) return;
  const t = document.getElementById(ONB[state.onb].target);
  if (!t) return;
  const r = t.getBoundingClientRect(), x = Math.min(Math.max(12, r.left + r.width / 2 - 150), window.innerWidth - 312);
  o.style.left = x + 'px';
  o.style.top = r.bottom + 14 + 'px';
  o.style.setProperty('--ax', Math.max(14, r.left + r.width / 2 - x - 8) + 'px');
}

/* =====================================================================
   8. RENDER + EVENTS
   ===================================================================== */
const shown = { drawer: false, scope: false, pop: null };
function parseRoute() {
  const h = (typeof location !== 'undefined' ? location.hash : '').replace(/^#\/?/, '').split('/');
  const map = { dashboard: 'dashboard', map: 'map', shipments: 'shipments', shipment: 'detail', alerts: 'alerts', customer: 'customer', carrier: 'carrier' };
  return { screen: map[h[0]] || 'dashboard', id: h[1] || 'SP-2405' };
}
function overlaysHtml() {
  const q = ui.pop && byId(ui.pop);
  const dr = state.inception && ui.drawer, sc = state.inception && ui.scope, ex = state.inception && ui.exp;
  const noAnim = (on, key) => (on && shown[key] ? 'style="animation:none"' : '');
  let h = '';
  if (dr) h += drawerHtml().replace('<aside class="drawer right"', `<aside ${noAnim(true, 'drawer')} class="drawer right"`);
  if (sc) h += '<div class="scrim" data-act="scope"></div>' + scopeHtml().replace('<aside class="drawer left"', `<aside ${noAnim(true, 'scope')} class="drawer left"`);
  if (ex) h += '<div class="scrim" data-act="export"></div>' + exportHtml();
  if (q && state.inception) h += popHtml(q);
  if (state.inception && state.onb < 3) h += onbHtml();
  shown.drawer = dr; shown.scope = sc;
  return h;
}
function render() {
  CFG = deriveCfg();
  ROUTE = parseRoute();
  const base = ROUTE.screen === 'detail' ? 'shipments' : ROUTE.screen, allowed = allowedTabs();
  if (!allowed.includes(base)) { ROUTE = { screen: allowed[0], id: ROUTE.id }; location.hash = ROUTES[allowed[0]]; return; }
  const ae = document.activeElement, focus = ae && ae.id && /input/i.test(ae.tagName) ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const keep = ['.drawer.right .body', '.drawer.left .body', '.pop', '#exportmodal pre'].map((s) => { const n = document.querySelector(s); return [s, n ? n.scrollTop : 0]; });
  document.documentElement.setAttribute('data-theme', state.theme);
  document.body.classList.toggle('inception', state.inception);
  document.getElementById('root').innerHTML = viewTopbar() + viewIncBar() + `<main id="main">${VIEWS[ROUTE.screen]()}</main>`;
  document.getElementById('overlay-root').innerHTML = overlaysHtml();
  applyScope();
  placePins();
  keep.forEach(([s, t]) => { const n = document.querySelector(s); if (n) n.scrollTop = t; });
  if (ui.flash) {
    const q = byId(ui.flash), els = [document.getElementById(q.anchor)].concat([...document.querySelectorAll(`[data-q~="${q.id}"]`)]);
    els.forEach((e) => e && e.classList.add('flash'));
    const v = document.getElementById('ver');
    if (v) v.classList.add('bump');
    ui.flash = null;
  }
  ui.hl = null;
  if (focus) { const n = document.getElementById(focus.id); if (n) { n.focus(); try { n.setSelectionRange(focus.s, focus.e); } catch (e) { /* not a text input */ } } }
  positionPop();
  positionOnb();
}
function toast(msg, ver) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.innerHTML = `${icon('spark', 15)}<span>${esc(msg)}</span>${ver ? `<span class="vp">v${state.version}</span>` : ''}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3100);
}
function commit(flashQ, hl, msg) {
  state.version++;
  ui.flash = flashQ;
  ui.hl = hl;
  saveState();
  render();
  toast(msg, true);
}
function answerQ(qid, k, text) {
  const q = byId(qid), prev = state.answers[qid];
  if (prev && prev.k === k && (k !== 'X' || prev.text === text)) return;
  state.answers[qid] = k === 'X' ? { k, text: text || '' } : { k };
  ui.otherOpen = null;
  commit(qid, qid, 'UI changed by your answer');
}
function openQ(qid) {
  const q = byId(qid);
  ui.pop = qid;
  ui.otherOpen = null;
  if (!document.getElementById(q.anchor)) {
    ui.pendingPop = qid;
    location.hash = SCREENS.find((s) => s.id === q.screen).hash;
    return;
  }
  render();
  const el = document.getElementById(q.anchor);
  if (el && el.scrollIntoView) { el.scrollIntoView({ block: 'center', inline: 'nearest' }); positionPop(); }
}
function nextQ(fromId) {
  const i = QUESTIONS.findIndex((q) => q.id === fromId), order = QUESTIONS.slice(i + 1).concat(QUESTIONS.slice(0, i));
  const nx = order.find((q) => !answered(q)) || order[0];
  if (nx) openQ(nx.id);
}
function closeAll() {
  if (ui.pop) { ui.pop = null; ui.otherOpen = null; } else if (ui.exp) ui.exp = false; else if (ui.scope) ui.scope = false; else if (ui.drawer) ui.drawer = false; else return;
  render();
}

const ACTIONS = {
  pin: (el) => openQ(el.dataset.id),
  answer: (el) => answerQ(el.dataset.qid, el.dataset.k),
  otheropen: (el) => { ui.otherOpen = el.dataset.qid; render(); const i = document.getElementById('other-input'); if (i) i.focus(); },
  answerx: (el) => { const i = document.getElementById('other-input'); answerQ(el.dataset.qid, 'X', i ? i.value.trim() : ''); },
  closepop: () => { ui.pop = null; render(); },
  nextq: (el) => nextQ(el.dataset.qid),
  gotoq: (el) => openQ(el.dataset.qid),
  inception: () => { state.inception = !state.inception; if (!state.inception) { ui.pop = null; } saveState(); render(); },
  theme: () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; saveState(); render(); },
  drawer: () => { ui.drawer = !ui.drawer; if (ui.drawer) ui.pop = null; render(); },
  scope: () => { ui.scope = !ui.scope; render(); },
  export: () => { ui.exp = !ui.exp; render(); },
  expfile: (el) => { ui.expFile = Number(el.dataset.v); render(); },
  dlone: () => { const f = EXPORTS[ui.expFile]; download(f.name, f.build(), f.mime); toast('Downloaded ' + f.name); },
  dlall: () => { EXPORTS.forEach((f, i) => setTimeout(() => download(f.name, f.build(), f.mime), i * 250)); toast('Downloading the 3 files'); },
  reset: () => {
    if (typeof confirm === 'function' && !confirm('Reset the demo? Answers, scope, gates and version will be cleared.')) return;
    const keep = { theme: state.theme, onb: 3 };
    state = Object.assign(freshState(), keep);
    Object.assign(ui, { pop: null, drawer: false, scope: false, exp: false, search: '', lot: '', mode: 'all', status: 'all', page: 0, gateEdit: null });
    saveState(); render(); toast('Demo reset');
  },
  gateok: (el) => { state.gates[el.dataset.stage] = { status: 'approved' }; ui.gateEdit = null; saveState(); render(); toast(`Stage ${el.dataset.stage} approved`); },
  gatechg: (el) => { ui.gateEdit = el.dataset.stage; render(); const t = document.getElementById('gate-text'); if (t) t.focus(); },
  gatecancel: () => { ui.gateEdit = null; render(); },
  gatesend: (el) => { const t = document.getElementById('gate-text'); state.gates[el.dataset.stage] = { status: 'changes', comment: t ? t.value.trim() : '' }; ui.gateEdit = null; saveState(); render(); toast(`Changes requested on stage ${el.dataset.stage}`); },
  gatereopen: (el) => { delete state.gates[el.dataset.stage]; saveState(); render(); },
  scopeset: (el) => { state.scope[el.dataset.m] = el.dataset.v; commit(null, 'SC-' + el.dataset.m, 'Scope updated'); },
  onbnext: () => { state.onb++; saveState(); render(); },
  onbskip: () => { state.onb = 3; saveState(); render(); },
  sort: (el) => { const k = el.dataset.v; ui.sort = { key: k, dir: ui.sort.key === k ? -ui.sort.dir : 1 }; render(); },
  fmode: (el) => { ui.mode = el.dataset.v; ui.page = 0; render(); },
  mapmode: (el) => { ui.mapMode = el.dataset.v; render(); },
  selship: (el) => { ui.sel = el.dataset.id; render(); },
  page: (el) => { ui.page = Math.max(0, ui.page + Number(el.dataset.v)); render(); },
  lotex: () => { ui.lot = 'L2644'; ui.page = 0; render(); },
  lotgo: (el) => { ui.lot = el.dataset.v.split('-')[0]; location.hash = '#/shipments'; },
  sevf: (el) => { ui.sevFilter = el.dataset.v; render(); },
  ack: (el) => { ui.recv['ack' + el.dataset.id] = !ui.recv['ack' + el.dataset.id]; render(); },
  recv: (el) => { ui.recv[el.dataset.id] = !ui.recv[el.dataset.id]; render(); },
  toast: (el) => toast(el.dataset.msg),
};
const CHANGES = {
  role: (v) => { state.role = v; saveState(); location.hash = ROUTES[v === 'customer' ? 'customer' : v === 'carrier' ? 'carrier' : 'dashboard']; render(); },
  lang: (v) => { state.lang = v; saveState(); render(); },
  fstatus: (v) => { ui.status = v; ui.page = 0; render(); },
  gotoship: (v) => { location.hash = '#/shipment/' + v; },
};
const INPUTS = {
  search: (v) => { ui.search = v; ui.page = 0; render(); },
  lot: (v) => { ui.lot = v; ui.page = 0; render(); },
};

function boot() {
  loadState();
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (t) { const fn = ACTIONS[t.dataset.act]; if (fn) fn(t, e); return; }
    if (ui.pop && !e.target.closest('.pop') && !e.target.closest('.pin')) { ui.pop = null; render(); }
  });
  document.addEventListener('change', (e) => { const t = e.target.closest('[data-change]'); if (t && CHANGES[t.dataset.change]) CHANGES[t.dataset.change](t.value); });
  document.addEventListener('input', (e) => { const t = e.target.closest('[data-input]'); if (t && INPUTS[t.dataset.input]) INPUTS[t.dataset.input](t.value); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeAll(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act]')) { e.preventDefault(); ACTIONS[e.target.dataset.act](e.target, e); }
    if (e.key === 'Enter' && e.target.id === 'other-input') { const b = document.querySelector('[data-act="answerx"]'); if (b) b.click(); }
  });
  window.addEventListener('hashchange', () => {
    ui.pop = ui.pendingPop || null;
    ui.pendingPop = null;
    window.scrollTo(0, 0);
    render();
    if (ui.pop) { const q = byId(ui.pop), el = document.getElementById(q.anchor); if (el && el.scrollIntoView) { el.scrollIntoView({ block: 'center' }); positionPop(); } }
  });
  window.addEventListener('scroll', positionPop, { passive: true });
  window.addEventListener('resize', () => { positionPop(); positionOnb(); });
  if (!location.hash) location.hash = '#/dashboard'; else render();
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { QUESTIONS, EFFECTS, MODULES, STAGES, SHIPMENTS, ALERTS, VIEWS, defaultCfg, deriveCfg, state: () => state, setState: (s) => { state = s; }, setCfg: (c) => { CFG = c; }, setRoute: (r) => { ROUTE = r; },
    exportQuestionsMd, exportUiMap, exportRequirementsMd, viewTopbar, viewIncBar, drawerHtml, scopeHtml, popHtml, overlaysHtml, UI_EFFECT_TEXT, ui };
}
if (typeof document !== 'undefined') boot();
</script>
</body>
